name: CI — Frontend

on:
  push:
    branches:
      - 'frontend/**'
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build for production
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
          VITE_APP_TITLE: Generic Base Project
          VITE_APP_ENV: local
        run: npm run build

      - name: Verify openapi.json exists
        run: |
          if [ ! -f "docs/contracts/openapi.json" ]; then
            echo "ERROR: docs/contracts/openapi.json not found"
            echo "Backend must publish the contract before frontend CI can pass"
            exit 1
          fi