name: CI — Infrastructure

on:
  push:
    branches:
      - 'infrastructure/**'
    paths:
      - 'infrastructure/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'infrastructure/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax (local)
        working-directory: infrastructure
        run: |
          cp envs/backend.env.example envs/backend.env
          cp envs/frontend.env.example envs/frontend.env
          cp envs/db.env.example envs/db.env
          docker compose config --quiet

      - name: Validate docker-compose syntax (prod override)
        working-directory: infrastructure
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Verify no real .env files were committed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE "infrastructure/envs/.*\.env$" | grep -v ".example"; then
            echo "ERROR: real .env file detected in commit"
            echo "Only .env.example files should be committed"
            exit 1
          fi