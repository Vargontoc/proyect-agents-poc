name: CI — Backend

on:
  push:
    branches:
      - 'backend/**'
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          JWT_SECRET: ci-test-secret-min-256-bits-long-enough
          JWT_EXPIRATION_MS: 86400000
          SPRING_PROFILES_ACTIVE: local
        run: ./mvnw verify -q

      - name: Validate openapi.json is up to date
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "backend/src/main/java"; then
            if ! git diff --name-only HEAD~1 HEAD | grep -q "docs/contracts/openapi.json"; then
              echo "ERROR: backend source changed but openapi.json was not updated"
              echo "Update docs/contracts/openapi.json before merging"
              exit 1
            fi
          fi